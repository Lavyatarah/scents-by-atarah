kind = "web"
previewPath = "/"
title = "Scent by Atarah"
version = "1.0.0"
id = "artifacts/scent-by-atarah"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23800

[services.development]
run = "pnpm --filter @workspace/scent-by-atarah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scent-by-atarah", "run", "build" ]
publicDir = "artifacts/scent-by-atarah/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23800"
BASE_PATH = "/"
